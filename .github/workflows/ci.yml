name: SmartCityAI Continuous Integration & Quality Gates

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-and-ml-testing:
    name: Backend, Data Pipeline & ML Test Fleet
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Quality Gate 1: Schema & Data Validation Tests
        run: |
          pytest tests/test_schemas.py tests/test_data_validation.py tests/test_cleaning.py -v

      - name: Quality Gate 2: Database ACID & Transaction Integrity
        run: |
          pytest tests/test_database.py -v

      - name: Quality Gate 3: Strict Data Leakage Prevention Gate
        run: |
          pytest tests/test_leakage.py -v

      - name: Quality Gate 4: ML Models, MLOps, Pipeline & Metamorphic Inference
        run: |
          pytest tests/test_ml_models.py tests/test_ml_pipeline.py tests/test_mlops.py tests/test_model_inference.py tests/test_forecasting.py tests/test_geospatial.py -v

      - name: Quality Gate 5: Model Drift (PSI) & Golden Regression Benchmarks
        run: |
          pytest tests/test_model_drift.py tests/test_regression.py -v

      - name: Quality Gate 6: REST API, XAI, AI Assistant & E2E Workflows
        run: |
          pytest tests/test_backend_api.py tests/test_xai.py tests/test_assistant.py tests/test_e2e_workflow.py -v

      - name: Full Test Fleet Coverage Report
        run: |
          pytest --cov=. --cov-report=term-missing --cov-fail-under=80

  frontend-testing:
    name: Frontend React, Component & Build Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Quality Gate 7: Frontend TypeScript Static Typecheck
        working-directory: ./frontend
        run: |
          npx tsc --noEmit

      - name: Quality Gate 8: Frontend Vitest Component Suite
        working-directory: ./frontend
        run: |
          npm test

      - name: Quality Gate 9: Production Vite Bundle Build
        working-directory: ./frontend
        run: |
          npm run build
